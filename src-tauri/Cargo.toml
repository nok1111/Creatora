[package]
name = "creatora"
version = "1.0.0"
description = "Creatora — all-in-one Creator Studio"
authors = ["Creatora"]
license = "Proprietary"
edition = "2021"
rust-version = "1.77"

[lib]
name = "creatora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ureq = { version = "3.2.1", features = ["json", "multipart"] }
keyring = "3.6"
sha2 = "0.10"
base64 = "0.22"
webbrowser = "1.2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
